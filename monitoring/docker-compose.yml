services:
  grafana:
    image: grafana/grafana-enterprise:12.2.5
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "3000:3000"
    environment:
      - GF_PLUGINS_PREINSTALL=yesoreyeram-infinity-datasource
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: {}